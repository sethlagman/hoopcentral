# Run:    docker compose up -d
# Rebuild: docker compose up -d --build (only after Dockerfile or requirements.txt changes)
# Ingest:  docker compose run --rm ingest
# Stop:   docker compose down
# Logs:   docker compose logs -f backend

services:
  db:
    image: postgres:16-alpine
    container_name: hoopcentral-db
    restart: unless-stopped
    # Same values as .env, via variable substitution.
    environment:
      POSTGRES_DB: ${DB_NAME:-hoopcentral}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Only for external tools; the backend uses the internal network.
    # 5433 avoids clashing with a local PostgreSQL on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hoopcentral-backend
    container_name: hoopcentral-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Add your domain in production.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    # Host source covers the code copied at build time. Installed packages stay in the image.
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    # --reload restarts workers when mounted Python files change
    command: >
      sh -c "python manage.py migrate --noinput &&
             python -m gunicorn --bind 0.0.0.0:8000 --workers 1 --reload hoopcentral.wsgi:application"

  # One-shot job. In production, run it as a separate task, not from the web service.
  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hoopcentral-backend
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh /app/data_ingestion/ingest.sh

  frontend:
    image: node:20-alpine
    container_name: hoopcentral-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent host node_modules from overwriting container's
    ports:
      - "5173:5173"
    environment:
      # Must include /api (see resolveApiRoot). The browser reaches the API via the host's port 8000.
      VITE_API_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run dev"
    # profiles:
    #   - frontend  # Only start with: docker compose --profile frontend up

volumes:
  postgres_data:
